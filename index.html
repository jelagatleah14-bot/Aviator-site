<!-- =========================================================
     EDUCATIONAL SIMULATION CONTROLS
     ========================================================= -->

<div class="demo-warning">
    ⚠️ EDUCATIONAL SIMULATION — FAKE MONEY ONLY — NO REAL BETTING
</div>

<div class="audio-control-wrap">
    <button id="audioMenuBtn" class="audio-menu-btn">
        🔊 Audio ▾
    </button>

    <div id="audioDropdown" class="audio-dropdown">

        <div class="audio-row">
            <span>🔊 Sound effects</span>
            <button id="soundToggle" class="audio-toggle active">
                ON
            </button>
        </div>

        <div class="audio-row">
            <span>🎵 Background music</span>
            <button id="musicToggle" class="audio-toggle active">
                ON
            </button>
        </div>

        <div class="audio-row volume-row">
            <span>🔉 Volume</span>
            <input
                id="masterVolume"
                type="range"
                min="0"
                max="1"
                value="0.35"
                step="0.01"
            >
        </div>

        <div class="audio-note">
            Original browser-generated demo audio.
        </div>

    </div>
</div>

<!-- Optional additional status indicators -->

<div class="simulation-status">
    <span>
        ROUND:
        <strong id="simRound">1</strong>
    </span>

    <span>
        STATUS:
        <strong id="simStatus">FLYING</strong>
    </span>

    <span>
        CRASH:
        <strong id="simCrash">—</strong>
    </span>

    <span>
        BET:
        <strong id="simBetStatus">NO BET</strong>
    </span>
</div>
